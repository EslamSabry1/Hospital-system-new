<div class="strip-container" id="stats-strip-inner">
    <div class="status-card normal">
        <div class="status-indicator"></div>
        <span class="status-text">Devices Running Normally</span>
        <span class="status-count" id="normal-count">{{ active_devices }}</span>
    </div>
    <div class="status-card warning">
        <div class="status-indicator"></div>
        <span class="status-text">Pending Maintenance</span>
        <span class="status-count" id="warning-count">{{ maintenance_devices }}</span>
    </div>
    <div class="status-card critical">
        <div class="status-indicator"></div>
        <span class="status-text">Critical Failures</span>
        <span class="status-count" id="critical-count">{{ critical_alerts }}</span>
    </div>
</div>
<small class="update-info">Last updated: {% now "H:i:s" %}</small>
